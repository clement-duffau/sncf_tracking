name: CI

# Tests du pipeline et du site à chaque push (hors main) et sur les pull requests.
on:
  push:
    branches-ignore: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Tests du pipeline (mini-jeu synthétique, sans réseau)
        run: python -m pytest -q tests
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Vérification, tests et build du site
        working-directory: site
        run: |
          npm ci
          npm run check
          npm test
          npm run build

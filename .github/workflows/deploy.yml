name: Données et déploiement

# Régénère les données à partir du portail open data SNCF puis publie le site sur GitHub Pages.
# Les publications SNCF sont irrégulières (TGV vers le 2 du mois, TER vers le 10, Intercités avec deux mois
# de décalage) : un passage chaque lundi suffit. Un passage planifié s'arrête tôt si aucun jeu n'a été
# republié depuis le dernier build (data/sources.lock.json) ; un push sur main ou un lancement manuel
# reconstruit toujours.
on:
  push:
    branches: [main]
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write   # mise à jour de data/sources.lock.json sur main
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      deployer: ${{ steps.decision.outputs.deployer }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt

      - name: Nouvelles données publiées ?
        id: verif
        run: python -m pipeline verifier

      - name: Décision
        id: decision
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] && [ "${{ steps.verif.outputs.nouveau }}" = "false" ]; then
            echo "Aucune nouvelle publication SNCF : pas de reconstruction."
            echo "deployer=false" >> "$GITHUB_OUTPUT"
          else
            echo "deployer=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Tests du pipeline
        if: steps.decision.outputs.deployer == 'true'
        run: python -m pytest -q tests

      # Échoue avec un message explicite si une source change de format (schémas, volumes, gares inconnues).
      # Dans ce cas le site déjà publié reste en place.
      - name: Pipeline de données
        if: steps.decision.outputs.deployer == 'true'
        run: python -m pipeline build

      # Un push fait avec GITHUB_TOKEN ne relance pas de workflow.
      - name: Enregistrer les dates de publication des sources
        if: steps.decision.outputs.deployer == 'true' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/sources.lock.json
          if git diff --cached --quiet; then echo "sources inchangées"; else
            git commit -m "Données : nouvelle publication SNCF"
            git pull --rebase origin main && git push origin HEAD:main
          fi

      - uses: actions/setup-node@v4
        if: steps.decision.outputs.deployer == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Build du site
        if: steps.decision.outputs.deployer == 'true'
        working-directory: site
        run: |
          npm ci
          npm run check
          npm test
          npm run build

      - uses: actions/configure-pages@v5
        if: steps.decision.outputs.deployer == 'true'
      - uses: actions/upload-pages-artifact@v3
        if: steps.decision.outputs.deployer == 'true'
        with:
          path: site/dist

  deploy:
    needs: build
    if: needs.build.outputs.deployer == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

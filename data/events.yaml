# Événements annotés sur les séries de régularité.
#
# Fichier tenu à la main et relu. Chaque entrée cite au moins une source. Le pipeline
# (pipeline/events.py) le valide et l'utilise pour :
#   - dessiner des bandes grisées sur les graphiques temporels ;
#   - exclure les mois listés dans `exclure` des calculs de tendances, de saisonnalité et de « Mon trajet »
#     (jamais du score : il reflète ce qu'ont vécu les voyageurs) ;
#   - documenter les ruptures de séries propres aux données (type `donnees`), dont certaines
#     changent les calculs (`effet`).
#
# Champs :
#   id        identifiant stable (minuscules, tirets)
#   titre     libellé affiché
#   type      greve | covid | incident | meteo | donnees | perimetre
#   debut     premier mois concerné (AAAA-MM)
#   fin       dernier mois concerné (AAAA-MM), par défaut = debut
#   types     types de train touchés : TGV, Intercités, TER
#   exclure   calculs dont ces mois sont retirés : tendances, saisonnalite, mon_trajet
#   effet     (type donnees) : gravite_invalide | rupture_causes
#   observe   ce que montrent les données (rapports pipeline/explore/sorties/)
#   sources   liens
#
# Le pipeline signale dans le journal de build les mois anormaux (annulations TGV > 5 %, ou trains
# programmés Intercités / TER en baisse de plus de 20 % sur un an) qui ne sont couverts par aucune entrée.

# ------------------------------------------------------------------ grèves
- id: greve-2014-reforme-ferroviaire
  titre: Grève contre la réforme ferroviaire
  type: greve
  debut: 2014-06
  types: [Intercités, TER]
  exclure: [tendances, saisonnalite, mon_trajet]
  observe: >-
    Trains TER programmés −28 % par rapport à juin 2013 ; 14 régions mentionnent la grève dans leurs
    commentaires. Grève reconductible à partir du 10 juin 2014 au soir, environ dix jours.
  sources:
    - https://www.kelbillet.com/blog/greve-sncf/sncf-greve-reconductible-partir-du-mardi-10-juin-2014
    - https://www.webmanagercenter.com/2014/06/20/151546/greve-sncf-le-mouvement-se-fissure-les-deputes-ont-acheve-leurs-travaux/

- id: greve-2016-loi-travail

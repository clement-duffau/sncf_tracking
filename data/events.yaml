- id: donnees-causes-2026
  titre: Changement probable de classement des causes de retard
  type: donnees
  debut: 2026-05
  types: [TGV]
  effet: rupture_causes
  exclure: []
  observe: >-
    D'un mois à l'autre, l'infrastructure passe d'environ 20 % à 6 % des causes, la gestion du trafic d'environ
    20 % à 5 %, la gestion en gare de 8–12 % à 21–32 %. Non documenté par le portail : les causes d'avant et
    d'après ne sont pas comparées.
  sources:
    - https://ressources.data.sncf.com/explore/dataset/regularite-mensuelle-tgv-aqst/

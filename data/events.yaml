  titre: Neige, verglas et tempête Goretti
  type: meteo
  debut: 2026-01
  types: [TGV, Intercités, TER]
  exclure: []
  observe: >-
    Régularité TGV recalculée sur les liaisons du service National : 77,6 % en janvier 2026 (84,0 % en février). Neige du 5 au 7 janvier

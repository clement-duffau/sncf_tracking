- id: normandie-transfert-ter
  titre: Les Intercités normands deviennent des TER
  type: perimetre
  debut: 2020-01
  types: [Intercités, TER]
  exclure: []
  observe: >-
    Les 14 liaisons Intercités normandes encore publiées s'arrêtent en décembre 2019 ; TER Normandie passe d'environ
